[project]
name = "document-extract"
version = "1.0.0"
description = "Extract typed fields from documents with validation and a bounded repair loop"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
document-extract = "document_extract.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["document_extract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
